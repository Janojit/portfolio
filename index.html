<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<nav>

    <a onclick="scrollToPanel('panel-education')">Education</a>
    <a onclick="scrollToPanel('panel-projects')">Projects</a>

  </div>

<section id="hero">

  <section id="panel-experience" class="panel">

  </section>

  </section>

  <section id="panel-skills" class="panel">

    <div id="skills-container"></div>
  </section>

  <section id="panel-cv" class="panel">
    <h2>Curriculum Vitae</h2>

       href="https://github.com/Janojit/portfolio2/raw/main/JANOJIT_CV.pdf"
       target="_blank">
       Download CV

<div id="project-modal" onclick="closeModal()">

    <span class="close-btn" onclick="closeModal()">×</span>

  </div>
</div>

<!-- CHATBOT -->
<div id="chatbot">

<script src="js/data.js"></script>
